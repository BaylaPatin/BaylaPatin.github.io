<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="valentine.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>Will You Be My Valentine?</h1>

        <div class="photo-placeholder">
            <img src="vday.jpg" alt="">
        </div>

        <div class="buttons">
            <button id="yesBtn" class="btn yes-btn">Yes</button>
            <button id="noBtn" class="btn no-btn">No</button>
        </div>
    </div>

    <!-- Mini Game Overlay -->
    <div id="gameOverlay" class="game-overlay">
        <div id="gameMessage" class="game-message">You have to try harder than that! Use your mouse to catch the heart!
        </div>
        <div id="score" class="game-message" style="font-size: 1.5rem;">Score: 0/5</div>
        <div id="heartTarget" class="heart-target">❤️</div>

        <!-- Wordle Container -->
        <div id="wordleGame" class="wordle-game">
            <h2 style="color: white; font-family: 'Pacifico'; margin-bottom: 1rem;">Guess the Word!</h2>
            <div id="wordleGrid" class="wordle-grid"></div>
            <div id="keyboard" class="keyboard"></div>
        </div>
    </div>

    <script src="valentine.js"></script>
</body>

</html>
